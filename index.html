<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>NOVA – Minigames</title>
  <meta name="description" content="Play-money minigames: Mines, Coin Flip, Tower, Chicken, Plinko, Dice and Upgrader.">
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='14' fill='%230b0712'/%3E%3Cpath d='M14 50V14h9l18 22V14h9v36h-9L23 28v22z' fill='%23c084fc'/%3E%3C/svg%3E">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@500;700&family=Sora:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <div class="bg-glow" aria-hidden="true"></div>

  <header class="topbar">
    <a class="brand" href="#/" aria-label="NOVA home">
      <span class="brand-mark" id="brandMark"></span>
      <span class="brand-name">NOVA</span>
    </a>
    <nav class="topnav" id="topnav"></nav>
    <div class="topbar-right">
      <div class="wallet-chip" title="Your play-money balance">
        <span id="chipIcon"></span>
        <span class="wallet-chip-label">Credit tokens</span>
        <strong id="chipBalance" class="mono">0</strong>
      </div>
    </div>
  </header>

  <main id="app"></main>

  <footer class="footer">
    <p><strong>Play money only.</strong> Credit tokens have no real-world value and cannot be bought, sold or cashed out. This is a demo for entertainment.</p>
    <button class="linklike" id="resetBtn" type="button">Reset balance &amp; inventory</button>
  </footer>

  <div class="toasts" id="toasts" aria-live="polite"></div>

  <script src="js/core.js"></script>
  <script src="js/games/mines.js"></script>
  <script src="js/games/coinflip.js"></script>
  <script src="js/games/tower.js"></script>
  <script src="js/games/chicken.js"></script>
  <script src="js/games/plinko.js"></script>
  <script src="js/games/dice.js"></script>
  <script src="js/games/upgrader.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
